name: Controle du code

# ---------------------------------------------------------------------------
#  FILET DE SECURITE
#
#  Raison d'etre : les scripts de ce depot sont souvent modifies depuis une
#  interface web, sans jamais passer par une machine de developpement. Rien ne
#  garantissait donc qu'ils soient seulement syntaxiquement corrects avant leur
#  execution reelle. Une faute de frappe restait invisible jusqu'au passage
#  automatique du lundi matin, ou elle apparaissait en rouge.
#
#  Ce controle tourne a chaque modification et repond a deux questions :
#     1. tous les scripts Python compilent-ils ?
#     2. tous les fichiers de donnees sont-ils du JSON valide ?
#
#  Il ne publie rien et ne touche a rien. Il ne fait que dire non.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'scripts/*.json'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    name: Syntaxe et fichiers de donnees
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compiler tous les scripts Python
        run: |
          set -euo pipefail
          python3 -m compileall -q build.py scripts/
          echo "Tous les scripts compilent."

      - name: Verifier les fichiers de donnees
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys

          fichiers = [
              "scripts/articles.json",
              "scripts/articles_auto.json",
              "scripts/sources.json",
              "scripts/state.json",
          ]
          for chemin in fichiers:
              try:
                  with open(chemin, encoding="utf-8") as f:
                      json.load(f)
              except Exception as exc:
                  print("::error::%s est illisible : %s" % (chemin, exc))
                  sys.exit(1)
              print("OK : %s" % chemin)
          PY

      - name: Verifier qu'aucun slug n'est publie deux fois
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from collections import Counter

          slugs = []
          for chemin in ("scripts/articles.json", "scripts/articles_auto.json"):
              with open(chemin, encoding="utf-8") as f:
                  slugs += [a["slug"] for a in json.load(f)]

          doublons = [s for s, n in Counter(slugs).items() if n > 1]
          if doublons:
              print("::error::Slug(s) presents deux fois : %s" % ", ".join(doublons))
              sys.exit(1)
          print("Aucun doublon parmi %d articles." % len(slugs))
          PY

      - name: Essai a blanc de la veille (sans appeler l'API)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")

          import build as site
          import veille

          # Aucun appel reseau : on substitue une reponse "rien de neuf". Le but
          # n'est pas de tester le modele, mais de verifier que tout ce qui
          # entoure l'appel tient debout — construction du prompt, catalogue
          # d'images, substitutions de chaines, lecture des fichiers de donnees.
          # Une erreur de formatage se voyait jusqu'ici seulement le lundi matin.
          veille.call_claude = lambda *a, **k: '{"no_novelty": true}'

          sources = veille.load(veille.SOURCES_PATH)
          state = dict(veille.load(veille.STATE_PATH))

          # On desactive le plafond : sinon la fonction sortirait AVANT de
          # construire le prompt, et l'essai ne testerait rien.
          state["max_publications_per_week"] = 10**6

          etat, article = veille.run_weekly(sources, state, site)

          assert article is None, "l'essai a blanc n'aurait pas du produire d'article"
          assert not veille.ECHEC, "la veille s'est signalee en echec pendant l'essai"

          catalogue = veille.catalogue_images(site)
          assert catalogue, "aucune illustration disponible dans le catalogue"

          noms = [s["name"] for s in veille.flatten_sources(sources)]
          inconnues = [k for k in etat.get("last_seen_by_source", {}) if k not in noms]
          if inconnues:
              print("::error::Clefs de last_seen_by_source hors de sources.json : %s"
                    % ", ".join(inconnues))
              sys.exit(1)

          print("Essai a blanc reussi : %d sources, %d illustrations."
                % (len(noms), len(catalogue)))
          PY
